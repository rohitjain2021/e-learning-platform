name: Frontend and dependency checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  FRONTEND_DIRECTORY: streamlit-ui
  BACKEND_DIRECTORY: backend
  INFRASTRUCTURE_DIRECTORY: infrastructure

jobs:
  dependencies:
    name: Check frontend, Python, and Serverless dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            ${{ env.FRONTEND_DIRECTORY }}/requirements.txt
            ${{ env.BACKEND_DIRECTORY }}/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python dependencies
        run: |
          python -m pip check
          python -c "import streamlit, requests, boto3"

      - name: Test frontend and API integration behavior
        working-directory: ${{ env.FRONTEND_DIRECTORY }}
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ${{ env.INFRASTRUCTURE_DIRECTORY }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ env.INFRASTRUCTURE_DIRECTORY }}/package-lock.json

      - name: Install Serverless Framework tooling
        working-directory: ${{ env.INFRASTRUCTURE_DIRECTORY }}
        run: npm ci

      - name: Check Serverless dependency
        working-directory: ${{ env.INFRASTRUCTURE_DIRECTORY }}
        run: npm ls serverless --depth=0
