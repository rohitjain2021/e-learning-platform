# One-time foundation: let this repository authenticate to AWS without storing AWS access keys.
# This is a separate stack because the application pipeline needs its role before it can deploy.
AWSTemplateFormatVersion: '2010-09-09'
Description: Project-scoped GitHub Actions deployment role; apply only through the approved account bootstrap process

# All inputs for this independent bootstrap stack are declared here.
# Its defaults match the application; existing account and GitHub identity details are supplied at creation.
Parameters:
  # Identify the project whose infrastructure this role may manage.
  ProjectName:
    Type: String
    Default: e-learning-platform
    AllowedPattern: '[a-z0-9-]+'
  # Keep development permissions separate from future environments.
  DeploymentStage:
    Type: String
    Default: dev
    AllowedPattern: '[a-z0-9-]+'
  # Reuse the account's existing GitHub identity provider instead of creating a duplicate.
  GitHubOidcProviderArn:
    Type: String
    Description: Existing account GitHub OIDC provider ARN
    AllowedPattern: 'arn:aws[a-z-]*:iam::[0-9]{12}:oidc-provider/token.actions.githubusercontent.com'
  # Trust only the exact repository and main branch; include immutable IDs when enabled.
  GitHubOidcSubject:
    Type: String
    Description: Exact main-branch OIDC subject for this repository; include immutable IDs when enabled
    AllowedPattern: 'repo:rohitjain2021(@[0-9]+)?/e-learning-platform(@[0-9]+)?:ref:refs/heads/main'
  # Limit optional Serverless artifact access to the existing deployment bucket.
  DeploymentArtifactBucketName:
    Type: String
    Default: serverless-framework-deployments-us-east-1-5b907a5f-c0ac
  # Limit storage configuration permissions to the existing project document bucket.
  DocumentBucketName:
    Type: String
    Default: e-learning-platform-knowledge-base

# Create only the deployment role; application resources belong to the main pipeline-managed stack.
Resources:
  # Give trusted GitHub Actions runs temporary permissions to deploy this project.
  GitHubDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ProjectName}-${DeploymentStage}-github-deploy
      MaxSessionDuration: 3600
      # Require a GitHub identity token for AWS STS with the exact approved repository subject.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Ref: GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  Ref: GitHubOidcSubject
      # Grant deployment operations by resource and purpose, without AdministratorAccess.
      Policies:
        - PolicyName: ProjectInfrastructureDeployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Manage only the project CloudFormation stack and its deployment change sets.
              - Sid: ProjectStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetStackPolicy
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-${DeploymentStage}/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*
              # Validate template syntax before execution; this API does not support a resource ARN.
              - Sid: ValidateCloudFormation
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: '*'
              # Read deployment-bucket settings without changing the shared artifact bucket.
              - Sid: ProjectArtifactBucketMetadata
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetEncryptionConfiguration
                  - s3:GetBucketVersioning
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::${DeploymentArtifactBucketName}
              # List only this project's deployment artifact prefix.
              - Sid: ListProjectArtifacts
                Effect: Allow
                Action: s3:ListBucket
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::${DeploymentArtifactBucketName}
                Condition:
                  StringLike:
                    s3:prefix:
                      Fn::Sub: serverless/${ProjectName}/${DeploymentStage}*
              # Read, write, or remove only this project's optional deployment artifacts.
              - Sid: ManageProjectArtifacts
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::${DeploymentArtifactBucketName}/serverless/${ProjectName}/${DeploymentStage}/*
              # Manage encryption and access settings on the source bucket, without reading its documents.
              - Sid: ConfigureDocumentBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                  - s3:GetBucketVersioning
                  - s3:PutBucketVersioning
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketOwnershipControls
                  - s3:PutBucketOwnershipControls
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::${DocumentBucketName}
              # Create or update only the named Bedrock service role; this role cannot change its own access.
              - Sid: ManageOnlyKnowledgeBaseServiceRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${DeploymentStage}-bedrock-kb-service
              # Allow assigning that service role only to Bedrock, not to unrelated AWS services.
              - Sid: PassKnowledgeBaseRoleOnlyToBedrock
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${DeploymentStage}-bedrock-kb-service
                Condition:
                  StringEquals:
                    iam:PassedToService: bedrock.amazonaws.com
              # Provision knowledge bases and their data-source connections in this account and region.
              - Sid: ManageKnowledgeBaseResources
                Effect: Allow
                Action:
                  - bedrock:CreateKnowledgeBase
                  - bedrock:UpdateKnowledgeBase
                  - bedrock:DeleteKnowledgeBase
                  - bedrock:GetKnowledgeBase
                  - bedrock:CreateDataSource
                  - bedrock:UpdateDataSource
                  - bedrock:DeleteDataSource
                  - bedrock:GetDataSource
                  - bedrock:ListDataSources
                  - bedrock:TagResource
                  - bedrock:UntagResource
                  - bedrock:ListTagsForResource
                  - bedrock:AllowVendedLogDeliveryForResource
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
              # Create and configure only the project's application log group.
              - Sid: ProjectLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DescribeLogStreams
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/bedrock/${ProjectName}/${DeploymentStage}/knowledge-base
                  - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/bedrock/${ProjectName}/${DeploymentStage}/knowledge-base:*
              # Connect the project log producer and destination; delivery IDs are assigned by AWS.
              - Sid: ProjectLogDelivery
                Effect: Allow
                Action:
                  - logs:PutDeliverySource
                  - logs:GetDeliverySource
                  - logs:DeleteDeliverySource
                  - logs:PutDeliveryDestination
                  - logs:GetDeliveryDestination
                  - logs:DeleteDeliveryDestination
                  - logs:PutDeliveryDestinationPolicy
                  - logs:GetDeliveryDestinationPolicy
                  - logs:DeleteDeliveryDestinationPolicy
                  - logs:CreateDelivery
                  - logs:GetDelivery
                  - logs:DeleteDelivery
                  - logs:UpdateDeliveryConfiguration
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:delivery-source:${ProjectName}-${DeploymentStage}-kb-application-source
                  - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:delivery-destination:${ProjectName}-${DeploymentStage}-kb-application-destination
                  - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:delivery:*
              # Allow regional logging discovery and policy APIs that cannot be restricted to an individual ARN.
              - Sid: LogDeliveryDiscoveryAndAccountPolicy
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeResourcePolicies
                  - logs:DescribeDeliverySources
                  - logs:DescribeDeliveryDestinations
                  - logs:DescribeDeliveries
                  - logs:PutResourcePolicy
                  - logs:DeleteResourcePolicy
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Ref: AWS::Region

# Return the deployment role ARN to save as the GitHub Actions variable AWS_DEPLOY_ROLE_ARN.
Outputs:
  DeploymentRoleArn:
    Value:
      Fn::GetAtt: [GitHubDeploymentRole, Arn]
