# Define the inputs used by this template here, before its resources.
# Ref reads an input below; Fn::Sub inserts inputs into resource names and identifiers.
Parameters:
  # Name this project so its resources and ownership tags are easy to recognize.
  ProjectName:
    Type: String
    Default: e-learning-platform
    AllowedPattern: '[a-z0-9-]+'
  # Keep development resources separate from future test or production environments.
  DeploymentStage:
    Type: String
    Default: dev
    AllowedPattern: '[a-z0-9-]+'
  # Expire old processing logs automatically to limit storage costs.
  KnowledgeBaseLogRetentionDays:
    Type: Number
    Default: 30

# The knowledge-base resource is defined in its own template; full validation checks that link.
Metadata:
  cfn-lint:
    config:
      ignore_checks: [E1010]

# Send document-processing logs to a clearly named CloudWatch destination for troubleshooting.
Resources:
  # Store the knowledge-base application logs together so they are easy to find.
  KnowledgeBaseApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    # Preserve existing troubleshooting logs if the stack or log-group definition is removed.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Include the project and environment in the log-group name to distinguish this application.
      LogGroupName:
        Fn::Sub: /aws/vendedlogs/bedrock/${ProjectName}/${DeploymentStage}/knowledge-base
      # Automatically expire older logs using the shared retention setting.
      RetentionInDays:
        Ref: KnowledgeBaseLogRetentionDays
      Tags:
      - Key: Project
        Value:
          Ref: ProjectName
  # Permit the AWS log-delivery service to write only to this destination in this account.
  KnowledgeBaseApplicationLogPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName:
        Fn::Sub: ${ProjectName}-${DeploymentStage}-kb-logs
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: DeliverKnowledgeBaseApplicationLogs
          Effect: Allow
          Principal:
            Service: delivery.logs.amazonaws.com
          Action:
          - logs:CreateLogStream
          - logs:PutLogEvents
          Resource:
            Fn::GetAtt:
            - KnowledgeBaseApplicationLogGroup
            - Arn
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
  # Identify this knowledge base as the producer of application and ingestion logs.
  KnowledgeBaseApplicationLogSource:
    Type: AWS::Logs::DeliverySource
    Properties:
      Name:
        Fn::Sub: ${ProjectName}-${DeploymentStage}-kb-application-source
      LogType: APPLICATION_LOGS
      ResourceArn:
        Fn::GetAtt:
        - LearningKnowledgeBase
        - KnowledgeBaseArn
  # Identify the CloudWatch log group where those logs should be delivered.
  KnowledgeBaseApplicationLogDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name:
        Fn::Sub: ${ProjectName}-${DeploymentStage}-kb-application-destination
      DestinationResourceArn:
        Fn::GetAtt:
        - KnowledgeBaseApplicationLogGroup
        - Arn
      # Use structured JSON log records so fields can be searched and filtered.
      OutputFormat: json
  # Connect the log producer to the destination, completing the delivery path.
  KnowledgeBaseApplicationLogDelivery:
    Type: AWS::Logs::Delivery
    Properties:
      DeliverySourceName:
        Fn::Sub: ${ProjectName}-${DeploymentStage}-kb-application-source
      DeliveryDestinationArn:
        Fn::GetAtt:
        - KnowledgeBaseApplicationLogDestination
        - Arn
    # Create the write permission and log source first, so delivery is not configured too early.
    DependsOn:
    - KnowledgeBaseApplicationLogPolicy
    - KnowledgeBaseApplicationLogSource
# Expose the log-group name so operators know where to investigate document-processing issues.
Outputs:
  KnowledgeBaseApplicationLogGroupName:
    Value:
      Ref: KnowledgeBaseApplicationLogGroup
