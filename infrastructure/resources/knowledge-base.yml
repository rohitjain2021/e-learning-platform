# Define the inputs used by this template here, before its resources.
# Ref reads an input below; Fn::Sub inserts inputs into resource names and identifiers.
Parameters:
  # Name this project so its resources and ownership tags are easy to recognize.
  ProjectName:
    Type: String
    Default: e-learning-platform
    AllowedPattern: '[a-z0-9-]+'
  # Keep development resources separate from future test or production environments.
  DeploymentStage:
    Type: String
    Default: dev
    AllowedPattern: '[a-z0-9-]+'
  # Describe this searchable collection in the AWS console.
  KnowledgeBaseDescription:
    Type: String
    Default: Learning documents with managed indexing and on-demand Nova embeddings
  # Read only this document folder inside the S3 bucket.
  KnowledgeBaseSourcePrefix:
    Type: String
    Default: demo/learning/
  # Select the Amazon model that turns document meaning into searchable numbers.
  EmbeddingModelId:
    Type: String
    Default: amazon.nova-2-multimodal-embeddings-v1:0
  # Set the embedding size required by the selected model and managed index.
  EmbeddingDimensions:
    Type: Number
    Default: 1024
  # The pipeline sets the exact knowledge base ID after its first creation.
  KnowledgeBaseTrustResourceId:
    Type: String
    Default: '*'
  # Expire temporary first-creation access; the default old date grants no access.
  KnowledgeBaseBootstrapTrustExpiresAt:
    Type: String
    Default: '1970-01-01T00:00:00Z'

# The S3 resource is defined in the storage template and checked when the templates are combined.
Metadata:
  cfn-lint:
    config:
      ignore_checks: [E1010, E1019, E1020]

# Detect the first deployment, before the knowledge base has an ID of its own.
Conditions:
  IsKnowledgeBaseBootstrap:
    Fn::Equals:
    - Ref: KnowledgeBaseTrustResourceId
    - '*'
# Create the access role, searchable knowledge base, and document-source connection.
Resources:
  # Give Bedrock only the permissions needed to read these documents and create embeddings.
  KnowledgeBaseServiceRole:
    Type: AWS::IAM::Role
    Properties:
      # Build a recognizable name from the shared project and environment settings.
      RoleName:
        Fn::Sub: ${ProjectName}-${DeploymentStage}-bedrock-kb-service
      Description: Read the project learning documents and invoke only the chosen
        embedding model
      # Only Bedrock in this account can use this role for the permitted knowledge base.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: bedrock.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseTrustResourceId}
            # During first creation, allow access only until the short deadline.
            # After creation, the pipeline removes this deadline and trusts only the exact knowledge base.
            DateLessThan:
              Fn::If:
              - IsKnowledgeBaseBootstrap
              - aws:CurrentTime:
                  Ref: KnowledgeBaseBootstrapTrustExpiresAt
              - Ref: AWS::NoValue
      # List individual allowed actions rather than granting broad administrator permissions.
      Policies:
      - PolicyName: KnowledgeBaseDocumentAndEmbeddingAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          # Allow listing only the configured document folder, not browsing unrelated bucket contents.
          - Sid: ListLearningDocuments
            Effect: Allow
            Action: s3:ListBucket
            Resource:
              Fn::GetAtt:
              - KnowledgeBaseBucket
              - Arn
            Condition:
              StringEquals:
                aws:ResourceAccount:
                  Ref: AWS::AccountId
              StringLike:
                s3:prefix:
                - Fn::Sub: ${KnowledgeBaseSourcePrefix}*
          # Allow reading source documents; this grants no permission to upload or delete them.
          - Sid: ReadLearningDocuments
            Effect: Allow
            Action: s3:GetObject
            Resource:
              Fn::Sub: ${KnowledgeBaseBucket.Arn}/${KnowledgeBaseSourcePrefix}*
            Condition:
              StringEquals:
                aws:ResourceAccount:
                  Ref: AWS::AccountId
          # Allow calling only the chosen embedding model, not every Bedrock model.
          - Sid: InvokeSelectedEmbeddingModel
            Effect: Allow
            Action: bedrock:InvokeModel
            Resource:
              Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}
          # Allow service health metrics only in the knowledge-base namespace.
          # This AWS operation has no resource ARN, so its namespace supplies the restriction.
          - Sid: PublishKnowledgeBaseMetrics
            Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: '*'
            Condition:
              StringEquals:
                cloudwatch:namespace: AWS/Bedrock/KnowledgeBases
      Tags:
      - Key: Project
        Value:
          Ref: ProjectName
  # Create the searchable document collection. Bedrock manages vector storage and indexing.
  LearningKnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Properties:
      Name:
        Fn::Sub: ${ProjectName}-${DeploymentStage}-knowledge-base
      Description:
        Ref: KnowledgeBaseDescription
      RoleArn:
        Fn::GetAtt:
        - KnowledgeBaseServiceRole
        - Arn
      # Use managed storage with the selected Amazon embedding model.
      # CUSTOM means we choose a Bedrock model; it does not mean we train a new model.
      KnowledgeBaseConfiguration:
        Type: MANAGED
        ManagedKnowledgeBaseConfiguration:
          EmbeddingModelType: CUSTOM
          EmbeddingModelArn:
            Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}
          # Use the global embedding size and the floating-point format required by this index.
          EmbeddingModelConfiguration:
            BedrockEmbeddingModelConfiguration:
              Dimensions:
                Ref: EmbeddingDimensions
              EmbeddingDataType: FLOAT32
      Tags:
        Project:
          Ref: ProjectName
  # Connect the knowledge base to the encrypted S3 document folder.
  LearningKnowledgeBaseDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      Name:
        Fn::Sub: ${ProjectName}-${DeploymentStage}-learning-documents
      Description: Learning documents from the existing encrypted S3 bucket
      KnowledgeBaseId:
        Ref: LearningKnowledgeBase
      # Removing the connection deletes its indexed content; the original S3 documents remain.
      DataDeletionPolicy: DELETE
      # Use the managed S3 connector. No sync schedule is set, so synchronization stays on demand.
      DataSourceConfiguration:
        Type: MANAGED_KNOWLEDGE_BASE_CONNECTOR
        ManagedKnowledgeBaseConnectorConfiguration:
          ConnectorParameters:
            type: S3
            version: '1'
            connectionConfiguration:
              bucketName:
                Ref: KnowledgeBaseBucket
              bucketOwnerAccountId:
                Ref: AWS::AccountId
            # Restrict ingestion to the globally configured folder inside the source bucket.
            filterConfiguration:
              inclusionPrefixes:
              - Ref: KnowledgeBaseSourcePrefix
      # Default chunking; on-demand sync (no SyncSchedule configured).
      # Let Bedrock parse document content before indexing it. Omitted chunking settings use defaults.
      VectorIngestionConfiguration:
        ParsingConfiguration:
          ParsingStrategy: SMART_PARSING
# Return the IDs needed to verify deployment and connect a future backend to this knowledge base.
Outputs:
  # The short ID a backend uses to select this knowledge base.
  LearningKnowledgeBaseId:
    Description: Managed learning knowledge base ID
    Value:
      Ref: LearningKnowledgeBase
  # The complete AWS identifier used to restrict the service role to this knowledge base.
  LearningKnowledgeBaseArn:
    Value:
      Fn::GetAtt:
      - LearningKnowledgeBase
      - KnowledgeBaseArn
  # The connection ID used when requesting an on-demand document synchronization.
  LearningKnowledgeBaseDataSourceId:
    Value:
      Fn::GetAtt:
      - LearningKnowledgeBaseDataSource
      - DataSourceId
  # The role identifier used to verify that document and model permissions stay restricted.
  LearningKnowledgeBaseServiceRoleArn:
    Value:
      Fn::GetAtt:
      - KnowledgeBaseServiceRole
      - Arn
