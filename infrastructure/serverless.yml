# Optional Serverless entry point; GitHub Actions deploys the same native YAML directly.
# Define this template's configurable settings here and reference them below.
custom:
  projectName: e-learning-platform
  deploymentStage: ${opt:stage, 'dev'}
  awsRegion: ${opt:region, 'us-east-1'}
  deploymentArtifactBucketName: serverless-framework-deployments-us-east-1-5b907a5f-c0ac
  # Supply the runtime trust and prebuilt package values before using this optional tool.
  knowledgeBaseTrustResourceId: ${env:KNOWLEDGE_BASE_TRUST_ID}
  knowledgeBaseBootstrapTrustExpiresAt: ${env:KNOWLEDGE_BASE_BOOTSTRAP_EXPIRES_AT, '1970-01-01T00:00:00Z'}
  lambdaArtifactKey: ${env:LAMBDA_ARTIFACT_KEY}

# Keep the service name aligned with the project so optional tooling targets the same stack.
service: ${self:custom.projectName}
# Use the supported major version recorded in the npm dependency manifest.
frameworkVersion: '4'
# Stop on invalid configuration instead of continuing with a misunderstood setting.
configValidationMode: error
# Block accidental infrastructure changes from a developer machine.
plugins:
  - ./plugins/pipeline-only.cjs
# Describe the AWS account environment and the existing deployment artifact location.
provider:
  name: aws
  region: ${self:custom.awsRegion}
  stage: ${self:custom.deploymentStage}
  deploymentBucket:
    name: ${self:custom.deploymentArtifactBucketName}
  # Pass runtime deployment values into the parameters declared at the top of the resource templates.
  stackParameters:
    - ParameterKey: DeploymentStage
      ParameterValue: ${self:custom.deploymentStage}
    - ParameterKey: KnowledgeBaseTrustResourceId
      ParameterValue: ${self:custom.knowledgeBaseTrustResourceId}
    - ParameterKey: KnowledgeBaseBootstrapTrustExpiresAt
      ParameterValue: ${self:custom.knowledgeBaseBootstrapTrustExpiresAt}
    - ParameterKey: LambdaArtifactKey
      ParameterValue: ${self:custom.lambdaArtifactKey}
  # Label the deployed stack for ownership and cost tracking.
  stackTags:
    Project: ${self:custom.projectName}
# Combine the component templates, each with its own parameters, into one CloudFormation stack.
resources:
  - ${file(resources/knowledge-base-storage.yml)}
  - ${file(resources/knowledge-base.yml)}
  - ${file(resources/knowledge-base-logging.yml)}
  - ${file(resources/lambda.yml)}
