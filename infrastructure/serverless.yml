# Optional Serverless entry point; GitHub Actions deploys the same native YAML directly.
# All infrastructure defaults live at the global level in parameters.yml.
custom:
  projectName: ${file(parameters.yml):Parameters.ProjectName.Default}
  deploymentStage: ${opt:stage, file(parameters.yml):Parameters.DeploymentStage.Default}
  awsRegion: ${opt:region, 'us-east-1'}
  deploymentArtifactBucketName: serverless-framework-deployments-us-east-1-5b907a5f-c0ac

service: ${self:custom.projectName}
frameworkVersion: '4'
configValidationMode: error
plugins:
  - ./plugins/pipeline-only.cjs
provider:
  name: aws
  region: ${self:custom.awsRegion}
  stage: ${self:custom.deploymentStage}
  deploymentBucket:
    name: ${self:custom.deploymentArtifactBucketName}
  stackParameters:
    - ParameterKey: DeploymentStage
      ParameterValue: ${self:custom.deploymentStage}
    - ParameterKey: KnowledgeBaseTrustResourceId
      ParameterValue: ${env:KNOWLEDGE_BASE_TRUST_ID}
    - ParameterKey: KnowledgeBaseBootstrapTrustExpiresAt
      ParameterValue: ${env:KNOWLEDGE_BASE_BOOTSTRAP_EXPIRES_AT, '1970-01-01T00:00:00Z'}
  stackTags:
    Project: ${self:custom.projectName}
resources:
  - ${file(parameters.yml)}
  - ${file(resources/knowledge-base-storage.yml)}
  - ${file(resources/knowledge-base.yml)}
  - ${file(resources/knowledge-base-logging.yml)}
